{% extends "base.html" %}
{% block title %}Submit Number{% endblock %}

{% block content %}
<h1>Submit a Numeric Value</h1>

<form method="POST">
    <label for="user_number">Enter a Number:</label>
    <input
        type="number"
        id="user_number"
        name="user_number"
        min="0"
        max="1000"
        step="1"
        required
    >
    <button type="submit">Submit</button>
</form>
{% endblock %}
